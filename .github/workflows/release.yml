name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.version }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release version is empty"
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release tag: $tag"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DAPP_NAME=QingMo -DQINGMO_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }

      - name: Package portable build
        shell: pwsh
        run: |
          cmake --build build --target package --config Release
          if ($LASTEXITCODE -ne 0) { throw "Package failed" }

          $stage = "QingMo-$env:TAG-win64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "build/package/*" -Destination $stage -Recurse -Force
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          Copy-Item -Path "build/bin/QingMo.exe" -Destination "$stage.exe" -Force
          Write-Host "Created $stage.zip and $stage.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingMo-win64
          path: |
            QingMo-*-win64.exe
            QingMo-*-win64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:TAG
          $exe = "QingMo-$tag-win64.exe"
          $zip = "QingMo-$tag-win64.zip"
          $assets = @($exe, $zip)

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            $ghArgs = @("release", "create", $tag) + $assets + @(
              "--title", "QingMo $tag",
              "--generate-notes",
              "--repo", $env:GITHUB_REPOSITORY
            )
            if ($env:GITHUB_REF_TYPE -ne "tag") {
              $ghArgs += @("--target", $env:GITHUB_SHA)
            }
            gh @ghArgs
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish GitHub Release"
          }
          Write-Host "Published release $tag"
